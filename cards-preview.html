<head>

<title>Mafia — Premium Character Cards</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:radial-gradient(1200px 600px at 50% -10%,#1c212b,#0e1013 60%);
  min-height:100vh;color:#e8eaee;font-family:'Inter',sans-serif;padding:40px 20px
}
h1{text-align:center;font:900 42px/1.05 'Cinzel',serif;letter-spacing:.04em;margin-bottom:10px}
p{text-align:center;color:#8b94a3;margin-bottom:40px}
.grid{display:flex;flex-wrap:wrap;justify-content:center;gap:30px;max-width:1400px;margin:0 auto}
.card-wrap{text-align:center}
.card-wrap h3{font:600 14px 'Oswald',sans-serif;letter-spacing:.14em;text-transform:uppercase;margin:16px 0 8px;color:#fff}
.card-wrap .faction{font-size:12px;color:#8b94a3;text-transform:uppercase;letter-spacing:.1em}
.card{width:260px;border-radius:18px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.5),0 0 0 1px #232833}
.card svg{width:100%;height:auto;display:block}
</style>
</head>

}

function roleAnim(id) {
  switch (id) {
    case "citizen":
      return `
        .kct-halo{animation:kct-halo 3s ease-in-out infinite}
        @keyframes kct-halo{0%,100%{opacity:.10;transform:scale(1)}50%{opacity:.28;transform:scale(1.25)}}
        .kct-lantern{animation:kct-lant 2.4s ease-in-out infinite}
        @keyframes kct-lant{0%,100%{filter:brightness(1)}50%{filter:brightness(1.55)}}
        .kct-glow{animation:kct-glowk 2.4s ease-in-out infinite;transform-origin:20px 2px}
        @keyframes kct-glowk{0%,100%{opacity:.28;transform:scale(1)}50%{opacity:.75;transform:scale(1.5)}}`;
    case "commissioner":
      return `
        .kct-scan{animation:kct-scanx 3.6s ease-in-out infinite}
        @keyframes kct-scanx{0%,100%{transform:translateX(0)}50%{transform:translateX(72px)}}
        .kct-mag{animation:kct-magk 3s ease-in-out infinite}
        @keyframes kct-magk{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
        .kct-badge{animation:kct-badk 2.2s ease-in-out infinite}
        @keyframes kct-badk{0%,100%{opacity:.75}50%{opacity:1;filter:drop-shadow(0 0 4px ${_roleAux(id).accent})}}`;
    case "sergeant":
      return `
        .kct-shield{animation:kct-shik .9s ease-in-out infinite}
        @keyframes kct-shik{0%,100%{transform:translateY(0)}50%{transform:translateY(-2.5px)}}
        .kct-dash{animation:kct-dashk 3.2s linear infinite}
        @keyframes kct-dashk{to{stroke-dashoffset:-16}}`;
    case "doctor":
      return `
        .kct-cross{animation:kct-cros 1s ease-in-out infinite;transform-origin:0px 5px}
        @keyframes kct-cros{0%,100%{transform:scale(1);opacity:.85}50%{transform:scale(1.22);opacity:1}}
        .kct-ecg{stroke-dasharray:110;stroke-dashoffset:110;animation:kct-ecgk 3.2s linear infinite}
        @keyframes kct-ecgk{0%{stroke-dashoffset:110}60%{stroke-dashoffset:0}100%{stroke-dashoffset:-110}}`;
    case "lucky":
      return `
        .kct-clover{animation:kct-clok 10s linear infinite;transform-origin:0 2px}
        @keyframes kct-clok{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
        .kct-spark{animation:kct-spark 2s ease-in-out infinite}
        @keyframes kct-spark{0%,100%{opacity:0;transform:scale(.5)}50%{opacity:1;transform:scale(1.25)}}
        .kct-dice{animation:kct-dsky 6s ease-in-out infinite}
        @keyframes kct-dsky{0%,92%,100%{transform:translateX(0)}95%{transform:translateX(-3px)}98%{transform:translateX(2px)}}`;
    case "kamikaze":
      return `
        .kct-spark{animation:kct-spkk .5s ease-in-out infinite}
        @keyframes kct-spkk{0%,100%{opacity:.7;transform:scale(1)}50%{opacity:1;transform:scale(1.6)}}
        .kct-flake{animation:kct-flk 2.4s ease-in infinite}
        @keyframes kct-flk{0%{opacity:0;transform:translateY(0)}20%{opacity:.9}100%{opacity:0;transform:translateY(-26px)}}`;
    case "don":
      return `
        .kct-smoke{animation:kct-smk 3.2s ease-in infinite}
        @keyframes kct-smk{0%{opacity:0;transform:translate(0,0) scale(1)}30%{opacity:.5}100%{opacity:0;transform:translate(8px,-22px) scale(1.8)}}
        .kct-ring{animation:kct-ring 2.4s ease-in-out infinite;transform-origin:-13px 2px}
        @keyframes kct-ring{0%,100%{transform:rotate(0deg);filter:drop-shadow(0 0 2px ${_roleAux(id).accent})}50%{transform:rotate(12deg);filter:drop-shadow(0 0 7px ${_roleAux(id).extra})}}
        .kct-core{animation:kct-cores 3.4s ease-in-out infinite}
        @keyframes kct-cores{0%,100%{transform:scale(1)}50%{transform:scale(1.35)}}`;
    case "mafia":
      return `
        .kct-bat{animation:kct-batk 3s ease-in-out infinite;transform-origin:20px 0}
        @keyframes kct-batk{0%,100%{transform:rotate(0deg)}50%{transform:rotate(-9deg) translateX(-2px)}}
        .kct-drip{animation:kct-dripk 3.4s ease-in infinite}
        @keyframes kct-dripk{0%{opacity:0;transform:translateY(0)}40%{opacity:.95}100%{opacity:0;transform:translateY(16px)}}`;
    case "maniac":
      return `
        .kct-blade{animation:kct-blak .14s steps(2) infinite}
        @keyframes kct-blak{0%,100%{opacity:1;transform:translateY(0)}50%{opacity:.55;transform:translateY(1px)}}
        .kct-eye{animation:kct-eyek 1.6s ease-in-out infinite}
        @keyframes kct-eyek{0%,100%{opacity:.6}50%{opacity:1;filter:drop-shadow(0 0 4px ${_roleAux(id).accent})}}
        .kct-drop{animation:kct-drop 2.6s ease-in infinite}
        @keyframes kct-drop{0%{opacity:0;transform:translate(0,0)}40%{opacity:1}100%{opacity:0;transform:translate(-6px,18px)}}`;
    case "mistress":
      return `
        .kct-hair{animation:kct-hair 5s ease-in-out infinite}
        @keyframes kct-hair{0%,100%{transform:rotate(0deg)}50%{transform:rotate(2deg)}}
        .kct-petal{animation:kct-petal 5s ease-in infinite}
        @keyframes kct-petal{0%{opacity:0;transform:translate(0,0) rotate(0deg)}15%{opacity:.9}100%{opacity:0;transform:translate(6px,44px) rotate(80deg)}}
        .kct-earring{animation:kct-eak 2s ease-in-out infinite}
        @keyframes kct-eak{0%,100%{opacity:.6}50%{opacity:1;filter:drop-shadow(0 0 3px ${_roleAux(id).extra})}}`;
    case "lawyer":
      return `
        .kct-scales{animation:kct-sclk 4s ease-in-out infinite;transform-origin:-13px -6px}
        @keyframes kct-sclk{0%,15%,100%{transform:rotate(0deg)}55%{transform:rotate(-4deg)}75%{transform:rotate(3deg)}}
        .kct-quill{animation:kct-quilk 2.8s ease-in infinite}
        @keyframes kct-quilk{0%{opacity:0;transform:translate(0,0)}30%{opacity:.9}100%{opacity:0;transform:translate(6px,20px)}}`;
    case "suicide":
      return `
        .kct-sway{animation:kct-swayk 5s ease-in-out infinite;transform-origin:0 -60px}
        @keyframes kct-swayk{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(4deg)}}
        .kct-ember{animation:kct-emb 3.6s ease-in infinite}
        @keyframes kct-emb{0%{opacity:0;transform:translateY(0)}40%{opacity:.8}100%{opacity:0;transform:translateY(-18px)}}`;
    case "vagabond":
      return `
        .kct-wolf{animation:kct-wolk 2.2s ease-in-out infinite}
        @keyframes kct-wolk{0%,100%{transform:translateY(0)}50%{transform:translateY(-2.5px)}}
        .kct-print{animation:kct-prk 4s ease-in infinite}
        @keyframes kct-prk{0%{opacity:0}30%{opacity:.7}100%{opacity:0}}`;
    default:
      return `
        .kct-dot{animation:kct-dot 2.4s ease-in-out infinite}
        @keyframes kct-dot{0%,100%{opacity:.5}50%{opacity:1}}`;
  }
}

function cardSceneUID(r, U) {
  const a = ART_AUX[r.fac] || ART_AUX.town;
  const au = _roleAux(r.id);
  const char = artEmblemUID(r.id, U);
  return `<svg viewBox="0 0 300 450" width="300" height="450" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="${U}bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="${a.g1}"/><stop offset="0.55" stop-color="${a.g2}"/><stop offset="1" stop-color="#04050a"/>
    </linearGradient>
    <radialGradient id="${U}core" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0" stop-color="${a.glow}"/><stop offset="1" stop-color="${a.glow}" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="${U}fglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="${au.accent}"/><stop offset="1" stop-color="${a.glow}"/>
    </radialGradient>
    <linearGradient id="${U}hl" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="${au.accent}"/><stop offset="0.5" stop-color="${a.glow}"/><stop offset="1" stop-color="${au.accent}"/>
    </linearGradient>
    <radialGradient id="${U}vig" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0.5" stop-color="transparent"/><stop offset="1" stop-color="#000" stop-opacity="0.66"/>
    </radialGradient>
  </defs>
  <style>
    @keyframes kfloat{0%{transform:translateY(0);opacity:0}15%{opacity:.7}85%{opacity:.5}100%{transform:translateY(-130px);opacity:0}}
    @keyframes kspin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
    @keyframes kspinr{from{transform:rotate(360deg)}to{transform:rotate(0deg)}}
    @keyframes kpulse{0%,100%{opacity:.32}50%{opacity:.85}}
    .kf{animation:kfloat 5s linear infinite}
    .ks{animation:kspin 36s linear infinite;transform-origin:150px 200px}
    .ksr{animation:kspinr 26s linear infinite;transform-origin:150px 200px}
    .kg{animation:kpulse 3s ease-in-out infinite}
    ${roleAnim(r.id)}
  </style>
  <rect width="300" height="450" fill="url(#${U}bg)"/>
  <circle cx="150" cy="182" r="250" fill="url(#${U}core)" class="kg"/>
  <ellipse cx="150" cy="392" rx="118" ry="16" fill="#000000" opacity="0.35"/>
  <line x1="26" y1="360" x2="274" y2="360" stroke="${au.accent}" stroke-width="1" opacity="0.22"/>
  <g class="ks" opacity="0.32">
    <circle cx="150" cy="210" r="152" fill="none" stroke="${a.ring}" stroke-width="1.2" stroke-dasharray="8 18"/>
    <circle cx="150" cy="210" r="118" fill="none" stroke="${a.ring}" stroke-width="1" stroke-dasharray="3 10"/>
  </g>
  <g class="ksr" opacity="0.28">
    <circle cx="150" cy="210" r="180" fill="none" stroke="${a.ring}" stroke-width="0.8" stroke-dasharray="2 16"/>
  </g>
  <g opacity="1" style="transform:translate(150px,186px)">${char}</g>
  <circle cx="46" cy="96" r="3" fill="${a.particle}" class="kf" style="animation-delay:0s"/>
  <circle cx="250" cy="140" r="2.4" fill="${a.particle}" class="kf" style="animation-delay:0.9s"/>
  <circle cx="92" cy="170" r="2.2" fill="${a.particle}" class="kf" style="animation-delay:1.7s"/>
  <circle cx="206" cy="88" r="2.8" fill="${a.particle}" class="kf" style="animation-delay:2.4s"/>
  <circle cx="150" cy="150" r="1.6" fill="${au.accent}" class="kf" style="animation-delay:3.1s"/>
  <circle cx="30" cy="230" r="2.2" fill="${a.particle}" class="kf" style="animation-delay:0.45s"/>
  <circle cx="270" cy="224" r="2.6" fill="${a.particle}" class="kf" style="animation-delay:1.2s"/>
  <circle cx="122" cy="70" r="1.8" fill="${a.particle}" class="kf" style="animation-delay:2s"/>
  <rect width="300" height="450" fill="url(#${U}vig)"/>
  <rect x="3" y="3" width="294" height="444" fill="none" stroke="${a.ring}" stroke-width="2" opacity="0.4"/>
</svg>`;
}

/* ========= MAIN RENDER ========= */
const ROLES = [
  {id:'citizen',fac:'town',name:'Fuqaro'},
  {id:'commissioner',fac:'town',name:'Komissar'},
  {id:'sergeant',fac:'town',name:'Sargerd'},
  {id:'doctor',fac:'town',name:'Doktor'},
  {id:'lucky',fac:'town',name:'Omadli'},
  {id:'kamikaze',fac:'town',name:'Kamikadze'},
  {id:'don',fac:'mafia',name:'Don'},
  {id:'mafia',fac:'mafia',name:'Mafiya'},
  {id:'maniac',fac:'neutral',name:'Maniak'},
  {id:'mistress',fac:'neutral',name:'Qizil'},
  {id:'lawyer',fac:'neutral',name:'Advokat'},
  {id:'suicide',fac:'neutral',name:'Intiharchi'},
  {id:'vagabond',fac:'neutral',name:'Vagabund'},
];
const FACTION_LABELS = {town:'Shahar',mafia:'Mafiya',neutral:'Neytral'};
const grid = document.getElementById('grid');
ROLES.forEach((r,i)=>{
  const wrap = document.createElement('div');
  wrap.className = 'card-wrap';
  wrap.innerHTML = `<div class="card">${cardSceneUID(r,'c'+i)}</div><h3>${r.name}</h3><span class="faction">${FACTION_LABELS[r.fac]}</span>`;
  grid.appendChild(wrap);
});
</script>
